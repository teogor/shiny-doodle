name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  build:
    name: Production docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ''
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build production site
        run: pnpm --filter @m3-glass/docs build
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-glass-docs-production
          path: apps/docs/.next
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deployment readiness
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deployment placeholder
        run: |
          echo 'Production artifact built successfully.'
          echo 'A hosting provider is not configured yet; this workflow intentionally does not claim to deploy.'
