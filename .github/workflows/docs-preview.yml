name: Docs Preview

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build documentation preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ''
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build docs
        run: pnpm --filter @m3-glass/docs build
      - name: Upload docs preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3-glass-docs-preview
          path: apps/docs/.next
          if-no-files-found: error
          retention-days: 7
